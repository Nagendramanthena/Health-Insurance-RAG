name: Sync to Hugging Face Space
on:
  push:
    branches: [huggingface]
jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push https://Nagendravarma:$HF_TOKEN@huggingface.co/spaces/Nagendravarma/Health-Insurance-RAG huggingface:main --force
