<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛠️ RAG Agentic Developer Console</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --glow-primary: rgba(99, 102, 241, 0.4);
  --glow-active: rgba(139, 92, 246, 0.6);
  --glow-success: rgba(16, 185, 129, 0.4);
  --border-glow: rgba(255, 255, 255, 0.08);
  --sidebar-bg: rgba(10, 17, 39, 0.95);
  --main-bg: radial-gradient(circle at 50% 50%, #0d1527 0%, #060a16 100%);
}

body {
  background: #060a16;
  background-image: var(--main-bg);
  color: #f1f5f9;
  font-family: 'Plus Jakarta Sans', sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── HEADER ── */
.header {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 20px 32px;
  background: rgba(10, 16, 36, 0.85);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border-glow);
  flex-shrink: 0;
  z-index: 10;
}
.header-logo {
  font-size: 1.5rem;
  background: linear-gradient(135deg, #818cf8, #c084fc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 8px;
}
.header-badge {
  font-size: 0.65rem;
  font-weight: 800;
  padding: 3px 10px;
  border-radius: 20px;
  background: linear-gradient(90deg, #4f46e5, #7c3aed);
  color: #fff;
  letter-spacing: 0.08em;
  box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
  text-transform: uppercase;
}
.session-id {
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  color: #94a3b8;
  background: rgba(255, 255, 255, 0.04);
  padding: 5px 12px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.08);
}

.body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── LEFT PANEL (Controls & Logs) ── */
.left {
  width: 480px;
  min-width: 460px;
  border-right: 1px solid var(--border-glow);
  display: flex;
  flex-direction: column;
  background: var(--sidebar-bg);
  backdrop-filter: blur(20px);
  z-index: 5;
  overflow-y: auto;
}

.query-area {
  padding: 32px;
  border-bottom: 1px solid var(--border-glow);
}
.query-area label {
  display: block;
  font-size: 0.7rem;
  font-weight: 700;
  color: #64748b;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 8px;
}
.query-area textarea {
  width: 100%;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  padding: 14px;
  color: #fff;
  font-family: inherit;
  font-size: 0.88rem;
  line-height: 1.5;
  resize: none;
  outline: none;
  transition: all 0.3s ease;
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
}
.query-area textarea:focus {
  border-color: #6366f1;
  background: rgba(255, 255, 255, 0.05);
  box-shadow: 0 0 15px rgba(99, 102, 241, 0.15), inset 0 2px 4px rgba(0, 0, 0, 0.2);
}

.run-btn {
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  background: linear-gradient(135deg, #4f46e5, #7c3aed);
  border: none;
  border-radius: 10px;
  color: #fff;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35);
}
.run-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 25px rgba(99, 102, 241, 0.55);
}
.run-btn:active {
  transform: translateY(1px);
}
.run-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* Theme toggle button */
.theme-toggle {
  margin-left: 10px;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.2);
  color: #f1f5f9;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.75rem;
  transition: background 0.3s ease;
}
.theme-toggle:hover {
  background: rgba(255,255,255,0.1);
}

/* Glass‑morphism panel backgrounds */
.left, .right, .header {
  background: var(--glass-bg, rgba(255,255,255,0.08));
  backdrop-filter: blur(12px);
}
/* Dark / Light mode */
body.dark-mode {
  --main-bg: radial-gradient(circle at 50% 50%, #0d1527 0%, #060a16 100%);
  --sidebar-bg: rgba(10, 17, 39, 0.95);
  --glow-primary: rgba(99, 102, 241, 0.4);
}
body.light-mode {
  --main-bg: radial-gradient(circle at 50% 50%, #f0f4ff 0%, #e0e7ff 100%);
  --sidebar-bg: rgba(255,255,255,0.9);
  --glow-primary: rgba(99, 102, 241, 0.2);
}

.intent-display {
  padding: 24px 32px;
  border-bottom: 1px solid var(--border-glow);
  display: none;
  background: rgba(255, 255, 255, 0.01);
}
.intent-display label {
  font-size: 0.7rem;
  font-weight: 700;
  color: #64748b;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.intent-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
  padding: 6px 14px;
  border-radius: 30px;
  font-size: 0.78rem;
  font-weight: 700;
  background: rgba(99, 102, 241, 0.15);
  color: #a5b4fc;
  border: 1px solid rgba(99, 102, 241, 0.3);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* ── TERMINAL LOGS ── */
.log-area {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding: 32px;
  background: rgba(5, 8, 20, 0.5);
  min-height: 350px;
  flex-shrink: 0;
}
.log-area label {
  font-size: 0.7rem;
  font-weight: 700;
  color: #64748b;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 12px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 6px;
}
.log-list-wrapper {
  flex: 1;
  overflow-y: auto;
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 16px;
  background: rgba(2, 4, 10, 0.7);
  padding: 20px;
  font-family: 'JetBrains Mono', monospace;
  box-shadow: inset 0 4px 15px rgba(0, 0, 0, 0.4);
}
.log-entry {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
  font-size: 0.75rem;
  line-height: 1.6;
  border-bottom: 1px solid rgba(255, 255, 255, 0.02);
  padding-bottom: 8px;
  animation: slideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.log-icon {
  flex-shrink: 0;
  font-size: 0.85rem;
}
.log-text {
  color: #f1f5f9;
  font-weight: 450;
}
.log-tag {
  font-size: 0.62rem;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  margin-right: 8px;
  text-transform: uppercase;
  display: inline-block;
  letter-spacing: 0.04em;
}
.tag-classify { background: rgba(139, 92, 246, 0.2); color: #c084fc; border: 1px solid rgba(139, 92, 246, 0.3); }
.tag-retrieve { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.25); }
.tag-synthesize { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.25); }
.tag-system { background: rgba(99, 102, 241, 0.15); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.25); }
.tag-error { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.25); }

.answer-card {
  margin: 0 32px 32px 32px;
  padding: 24px;
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.08) 0%, rgba(16, 185, 129, 0.02) 100%);
  border: 1px solid rgba(16, 185, 129, 0.3);
  border-radius: 16px;
  display: none;
  animation: fadeUp 0.35s ease-out;
  box-shadow: 0 4px 20px rgba(16, 185, 129, 0.1);
  flex-shrink: 0;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.answer-card .ans-label {
  font-size: 0.7rem;
  font-weight: 800;
  color: #34d399;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.answer-card .ans-text {
  font-size: 0.85rem;
  line-height: 1.6;
  color: #e2e8f0;
}

/* ── RIGHT PANEL (Interactive Diagram) ── */
.right {
  flex: 1;
  overflow: hidden;
  padding: 32px 40px;
  display: flex;
  flex-direction: column;
}
.diagram-label {
  font-size: 0.72rem;
  font-weight: 700;
  color: #64748b;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
#svg-wrap {
  flex: 1;
  width: 100%;
  background: rgba(10, 16, 36, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 20px;
  padding: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 4px 30px rgba(0, 0, 0, 0.3);
}
svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* ── Node Graph styling ── */
.n rect {
  stroke-width: 1.5;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  rx: 16;
  ry: 16;
}
.n.idle rect {
  fill: #0c1224;
  stroke: rgba(255, 255, 255, 0.12);
}
.n.active rect {
  fill: rgba(124, 58, 237, 0.25);
  stroke: #a78bfa;
  stroke-width: 2;
  filter: drop-shadow(0 0 12px rgba(139, 92, 246, 0.4));
}
.n.done rect {
  fill: rgba(16, 185, 129, 0.15);
  stroke: #10b981;
  stroke-width: 1.8;
}
.n.skip rect {
  fill: #050811;
  stroke: rgba(255, 255, 255, 0.03);
  opacity: 0.35;
}
.n .icon {
  font-size: 16px;
}
.n .title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 11px;
  font-weight: 700;
  fill: #e2e8f0;
}
.n .sub {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 8.5px;
  fill: #64748b;
  font-weight: 500;
}

/* LangSmith node distinct styling */
#nd-langsmith.idle rect {
  fill: rgba(6, 182, 212, 0.07);
  stroke: rgba(6, 182, 212, 0.25);
}
#nd-langsmith.active rect {
  fill: rgba(6, 182, 212, 0.22);
  stroke: #22d3ee;
  stroke-width: 2;
  filter: drop-shadow(0 0 12px rgba(6, 182, 212, 0.5));
}
#nd-langsmith.done rect {
  fill: rgba(6, 182, 212, 0.15);
  stroke: #06b6d4;
  stroke-width: 1.8;
}

.pulse {
  fill: none;
  stroke: #a78bfa;
  stroke-width: 1.5;
  opacity: 0;
  pointer-events: none;
}
.n.active .pulse {
  animation: pulseNode 1.8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
}
@keyframes pulseNode {
  0% { r: 35px; opacity: 0.8; }
  100% { r: 75px; opacity: 0; }
}

/* Edge Lines */
.edge {
  fill: none;
  stroke: rgba(148, 163, 184, 0.18);
  stroke-width: 2;
  stroke-dasharray: 6 4;
  transition: all 0.3s ease;
}
.edge.active-edge {
  stroke: #818cf8;
  stroke-width: 3;
  stroke-dasharray: 10 3;
  animation: dash 1s linear infinite;
  filter: drop-shadow(0 0 5px rgba(129, 140, 248, 0.7));
}
.edge.done-edge {
  stroke: #10b981;
  stroke-width: 2;
  stroke-dasharray: none;
}
@keyframes dash {
  to {
    stroke-dashoffset: -20;
  }
}

/* Intent pills in SVG */
.intent-tag {
  rx: 8;
  ry: 8;
  transition: all 0.3s ease;
}
.intent-tag.active-intent {
  fill: rgba(124, 58, 237, 0.25);
  stroke: #a78bfa;
  stroke-width: 1.5;
}
.intent-tag.inactive-intent {
  fill: rgba(255, 255, 255, 0.02);
  stroke: rgba(255, 255, 255, 0.06);
}

/* ── STATUS BAR ── */
.status {
  padding: 16px 32px;
  border-top: 1px solid var(--border-glow);
  background: rgba(8, 14, 32, 0.9);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.78rem;
  color: #64748b;
  flex-shrink: 0;
  font-weight: 500;
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #64748b;
  flex-shrink: 0;
  transition: all 0.3s ease;
}
.dot.running {
  background: #6366f1;
  box-shadow: 0 0 10px #6366f1;
  animation: blink 1.5s infinite;
}
.dot.done {
  background: #10b981;
  box-shadow: 0 0 10px #10b981;
}
@keyframes blink { 50% { opacity: 0.4; } }

/* Tooltip */
#tooltip {
  position: absolute;
  background: rgba(10, 16, 36, 0.95);
  border: 1px solid rgba(99, 102, 241, 0.4);
  border-radius: 12px;
  padding: 16px;
  color: #e2e8f0;
  font-size: 0.8rem;
  pointer-events: none;
  display: none;
  z-index: 2000;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(12px);
  max-width: 320px;
  line-height: 1.6;
}
#tooltip b {
  color: #a5b4fc;
  display: block;
  margin-bottom: 8px;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
#tooltip div {
  margin-bottom: 6px;
  border-left: 2px solid #6366f1;
  padding-left: 8px;
}

/* ── CYBER SECURITY LOGIN ── */
#login-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(4, 7, 16, 0.95);
  backdrop-filter: blur(25px);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  transition: opacity 0.3s ease;
}
.login-box {
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid rgba(99, 102, 241, 0.2);
  padding: 56px 48px;
  border-radius: 32px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
  width: 400px;
}
.login-box h2 {
  margin-bottom: 8px;
  color: #fff;
  font-size: 1.4rem;
  font-weight: 800;
}
.login-box p {
  color: #64748b;
  font-size: 0.82rem;
  margin-bottom: 24px;
}
.login-box input {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: white;
  font-size: 1.3rem;
  text-align: center;
  margin-bottom: 24px;
  outline: none;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.15em;
  transition: all 0.3s ease;
}
.login-box input:focus {
  border-color: #6366f1;
  box-shadow: 0 0 15px rgba(99, 102, 241, 0.25);
}
.login-box button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  background: linear-gradient(135deg, #4f46e5, #7c3aed);
  color: white;
  border: none;
  font-weight: 700;
  font-size: 0.92rem;
  cursor: pointer;
  transition: all 0.25s ease;
  box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
}
.login-box button:hover {
  background: linear-gradient(135deg, #4338ca, #6d28d9);
  box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
}
.login-error {
  color: #ef4444;
  font-size: 0.78rem;
  margin-top: 14px;
  display: none;
  font-weight: 600;
}

::-webkit-scrollbar {
  width: 5px;
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.08);
  border-radius: 10px;
}
</style>
</head>
<body>

<div id="login-overlay">
  <div class="login-box">
    <h2>Access Console</h2>
    <p>Please enter the security passkey</p>
    <input type="password" id="pass-input" placeholder="••••" maxlength="4">
    <button onclick="checkPass()">Unlock Console</button>
    <div id="login-err" class="login-error">🔒 Invalid authorization code.</div>
  </div>
</div>

<div class="header">
  <div class="header-logo">🛡️ HealthGuard</div>
  <span class="header-badge">RAG DEV CONSOLE</span>
  <span class="session-id" id="sid">—</span>
  <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>
</div>

<div class="body">
  <div class="left">
    <div class="query-area">
      <label>Run Pipeline Experiment</label>
      <textarea id="qinput" rows="3" placeholder="e.g. Compare Bronze and Gold plan copays for Metformin"></textarea>
      <button class="run-btn" id="runbtn" onclick="run()">🚀 Execute Live Trace</button>
    </div>
    <div class="intent-display" id="intent-display">
      <label>Extracted Intent</label>
      <div class="intent-pill" id="intent-pill">—</div>
    </div>
    <div class="log-area">
      <label>⚡ System Event Stream</label>
      <div class="log-list-wrapper">
        <div id="loglist"></div>
      </div>
    </div>
    <div class="answer-card" id="answer-card">
      <div class="ans-label">✨ Pipeline Response</div>
      <div class="ans-text" id="answer-text"></div>
    </div>
  </div>
  <div class="right">
    <div class="diagram-label">📊 Interactive Orchestrator Workflow</div>
    <div id="svg-wrap"><svg id="diagram"></svg></div>
  </div>
</div>

<div id="tooltip"></div>
<div class="status">
  <div class="dot" id="sdot"></div>
  <span id="stxt">Ready — Enter parameters to begin orchestrating trace events.</span>
</div>

<script>
const API = '';
let SID = localStorage.getItem('rag_sid') || crypto.randomUUID();
localStorage.setItem('rag_sid', SID);
document.getElementById('sid').textContent = 'Session ID: ' + SID.slice(0,8) + '…';

// ── Authentication ──
if(sessionStorage.getItem('dev_auth') === 'true') {
  document.getElementById('login-overlay').style.display = 'none';
}
function checkPass() {
  const p = document.getElementById('pass-input').value;
  if(p === '2002') {
    sessionStorage.setItem('dev_auth', 'true');
    document.getElementById('login-overlay').style.opacity = '0';
    setTimeout(() => {
      document.getElementById('login-overlay').style.display = 'none';
    }, 300);
  } else {
    document.getElementById('login-err').style.display = 'block';
    document.getElementById('pass-input').value = '';
  }
}

function toggleTheme() {
  const body = document.body;
  if(body.classList.contains('dark-mode')) {
    body.classList.remove('dark-mode');
    body.classList.add('light-mode');
  } else {
    body.classList.remove('light-mode');
    body.classList.add('dark-mode');
  }
}
document.getElementById('pass-input').addEventListener('keydown', e => { if(e.key === 'Enter') checkPass(); });

let multiQueryVariants = [];
const tt = document.getElementById('tooltip');

// ──────────────────────────────────────────────
// GRAPH LAYOUT & D3 VARIABLES
// ──────────────────────────────────────────────
const NW = 170, NH = 56;

const NODES = [
  {id:'user',        icon:'👤', title:'User Query',          sub:'pipeline entry',           x:20,   y:30},
  {id:'fastapi',     icon:'⚡', title:'FastAPI Host',        sub:'/chat/stream',             x:220,  y:30},
  {id:'orchestrator',icon:'🧠', title:'Orchestrator',        sub:'LangGraph core',           x:420,  y:30},
  {id:'mem_search',  icon:'🧠', title:'Memory Search',       sub:'Mem0 retrieval',           x:620,  y:30},
  {id:'intent_node', icon:'🔍', title:'Intent Classifier',   sub:'GPT-4o-mini classify',     x:820,  y:30},

  {id:'langsmith',   icon:'📡', title:'LangSmith Tracing',   sub:'Observability & traces',   x:420,  y:632},

  {id:'retrieve_agent', icon:'📂', title:'Retrieval Agent',  sub:'Task distributor',         x:820,  y:116},
  {id:'multiquery',     icon:'🔮', title:'Multi-Query',      sub:'Query variation model',    x:220,  y:202},

  {id:'graphdb',     icon:'🕸️', title:'Knowledge Graph',     sub:'NetworkX entity lookup',   x:20,   y:374},
  {id:'vectordb',    icon:'🗃️', title:'Vector Store',        sub:'ChromaDB cosine sim',      x:220,  y:374},
  {id:'bm25',        icon:'🔤', title:'BM25 Search',          sub:'Sparse lex search',        x:420,  y:374},

const INTENT_PILLS = [
  {id:'i_simple',     label:'SIMPLE_LOOKUP',   x:1020, y:30,  w:140, h:24},
  {id:'i_policy',     label:'POLICY_QUESTION', x:1020, y:60,  w:140, h:24},
  {id:'i_multihop',   label:'MULTI_HOP',       x:1020, y:90,  w:140, h:24},

];

const EDGES = [
  ['user','fastapi'],['fastapi','orchestrator'],['orchestrator','mem_search'],['mem_search','intent_node'],
  ['orchestrator','langsmith'],
  ['intent_node','retrieve_agent'],
  ['retrieve_agent','multiquery'],
  ['multiquery','graphdb'],['multiquery','vectordb'],['multiquery','bm25'],
  ['retrieve_agent','priorauth'],
  ['retrieve_agent','bronze'],['retrieve_agent','silver'],['retrieve_agent','gold'],
  ['vectordb','ensemble'],['bm25','ensemble'],
  ['graphdb','reranker'],['ensemble','reranker'],
  ['priorauth','merger'],['bronze','merger'],['silver','merger'],['gold','merger'],
  ['reranker','merger'],
  ['merger','synthesis'],['synthesis','langsmith'],['synthesis','mem_add'],['mem_add','answer'],
];

const STEP_MAP = [
  // ── Intent patterns from orchestrator steps_log ──
  {pat:/SIMPLE_LOOKUP/i,              nodes:['graphdb','vectordb','bm25','ensemble','multiquery']},
  {pat:/POLICY_QUESTION/i,            nodes:['vectordb','bm25','ensemble','multiquery']},
  {pat:/MULTI_HOP.*Graph.*Policy.*Prior/i, nodes:['graphdb','vectordb','bm25','ensemble','multiquery','priorauth']},
  {pat:/MULTI_HOP/i,                  nodes:['graphdb','vectordb','bm25','ensemble','multiquery','priorauth']},
  {pat:/COMPARISON/i,                 nodes:['bronze','silver','gold','vectordb','bm25','ensemble','multiquery']},
  // ── Per-tier retrieval patterns (from COMPARISON) ──
  {pat:/Bronze Tier/i,                nodes:['bronze']},
  {pat:/Silver Tier/i,                nodes:['silver']},
  {pat:/Gold Tier/i,                  nodes:['gold']},
  // ── Individual retrieval component patterns ──
  {pat:/Graph entity lookup/i,        nodes:['graphdb','vectordb','bm25','ensemble']},
  {pat:/Hybrid document retrieval/i,  nodes:['vectordb','bm25','ensemble']},
  {pat:/Hybrid policy retrieval/i,    nodes:['vectordb','bm25','ensemble']},
  {pat:/Multi-Query Variant/i,        nodes:['multiquery','vectordb','bm25','ensemble','graphdb']},
  {pat:/Multi-Query/i,                nodes:['multiquery']},
  {pat:/Prior.?auth/i,                nodes:['priorauth']},
  {pat:/Bronze/i,                     nodes:['bronze']},
  {pat:/Silver/i,                     nodes:['silver']},
  {pat:/Gold/i,                       nodes:['gold']},
  {pat:/Intent classified/i,          nodes:['intent_node']},
  {pat:/Retrieved \d+/i,              nodes:['reranker','merger']},
  {pat:/Answer synthesized/i,         nodes:['synthesis','langsmith']},
  {pat:/LangSmith|langsmith|trace/i,  nodes:['langsmith']},
  {pat:/Mem0 stored|Mem0: no new/i,   nodes:['mem_add']},
  {pat:/Searching Mem0|Mem0 recalled|Mem0: no relevant/i, nodes:['mem_search']},
];

const LG_START = {
  memory_search:   ['mem_search'],
  classify_intent: ['intent_node'],
  retrieve:        ['retrieve_agent'],
  synthesize:      ['synthesis'],
  memory_add:      ['mem_add'],
};

// ── BUILD D3 INTERACTIVE SVG ──
const svg = d3.select('#diagram');
const VW = 1250, VH = 720;
svg.attr('viewBox', `0 0 ${VW} ${VH}`);

svg.append('defs').append('marker')
  .attr('id','arr').attr('viewBox','0 -6 12 12')
  .attr('refX',12).attr('refY',0).attr('markerWidth',7).attr('markerHeight',7)
  .attr('orient','auto')
  .append('path').attr('d','M0,-5L10,0L0,5').attr('fill','rgba(148,163,184,0.3)');

const cx = n => n.x + NW/2;
const cy = n => n.y + NH/2;
const nm = {}; NODES.forEach(n=>nm[n.id]=n);

const edgeG = svg.append('g');
const edgeSel = {};
EDGES.forEach(([f,t],i)=>{
  const fn=nm[f], tn=nm[t]; if(!fn||!tn) return;
  const x1=cx(fn), y1=cy(fn), x2=cx(tn), y2=cy(tn);
  const mx=(x1+x2)/2;
  const p = edgeG.append('path')
    .attr('id',`e${i}`).attr('class','edge')
    .attr('d',`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`)
    .attr('marker-end','url(#arr)');
  edgeSel[`${f}→${t}`]=p;
});

const pillG = svg.append('g');
const pillSel={};
INTENT_PILLS.forEach(p=>{
  const g=pillG.append('g').attr('id',`pill-${p.id}`);
  g.append('rect').attr('x',p.x).attr('y',p.y).attr('width',p.w).attr('height',p.h)
   .attr('class','intent-tag inactive-intent');
  g.append('text').attr('x',p.x+p.w/2).attr('y',p.y+p.h/2+4)
   .attr('text-anchor','middle').attr('fill','#475569')
   .attr('font-family','\'Plus Jakarta Sans\',sans-serif').attr('font-size',10).attr('font-weight',700)
   .text(p.label);
  pillSel[p.id]=g;
});

const nodeG = svg.append('g');
const nodeSel = {};
NODES.forEach(n=>{
  const g=nodeG.append('g').attr('id',`nd-${n.id}`).attr('class','n idle');
  g.append('rect').attr('x',n.x).attr('y',n.y).attr('width',NW).attr('height',NH);
  g.append('circle').attr('cx',n.x+NW/2).attr('cy',n.y+NH/2).attr('class','pulse');
  g.append('text').attr('class','icon').attr('x',n.x+12).attr('y',n.y+NH/2+5).text(n.icon);
  g.append('text').attr('class','title').attr('x',n.x+36).attr('y',n.y+NH/2-5).text(n.title);
  g.append('text').attr('class','sub').attr('x',n.x+36).attr('y',n.y+NH/2+10).text(n.sub);
  nodeSel[n.id]=g;

  if(n.id==='multiquery'){
    g.style('cursor','help');
    g.on('mouseover', (e)=>{
      if(multiQueryVariants.length===0) return;
      tt.style.display='block';
      const unique = [...new Set(multiQueryVariants)];
      tt.innerHTML = `<b>Generated Multi-Query Variants</b>` + 
        unique.map(v => `<div>${v}</div>`).join('');
      tt.style.left = (e.pageX + 15) + 'px';
      tt.style.top = (e.pageY + 15) + 'px';
    })
    .on('mousemove', (e)=>{
      tt.style.left = (e.pageX + 15) + 'px';
      tt.style.top = (e.pageY + 15) + 'px';
    })
    .on('mouseout', ()=> tt.style.display='none');
  }
});

// ── ORCHESTRATION EVENT RUNNERS ──
function setNode(id, state){
  const g=nodeSel[id]; if(!g) return;
  g.attr('class',`n ${state}`);
}
function activateEdge(f,t){
  const k=`${f}→${t}`;
  if(edgeSel[k]) edgeSel[k].attr('class','edge active-edge');
}
function doneEdge(f,t){
  const k=`${f}→${t}`;
  if(edgeSel[k]) edgeSel[k].attr('class','edge done-edge');
}
function setIntent(intentStr){
  const map={SIMPLE_LOOKUP:'i_simple',POLICY_QUESTION:'i_policy',MULTI_HOP:'i_multihop',COMPARISON:'i_comparison'};
  INTENT_PILLS.forEach(p=>{
    const g=pillSel[p.id]; if(!g) return;
    const active=map[intentStr]===p.id;
    g.select('rect').attr('class',`intent-tag ${active?'active-intent':'inactive-intent'}`);
    g.select('text').attr('fill', active?'#a5b4fc':'#475569');
  });
  document.getElementById('intent-display').style.display='block';
  const colors={SIMPLE_LOOKUP:'#818cf8',POLICY_QUESTION:'#10b981',MULTI_HOP:'#a78bfa',COMPARISON:'#f59e0b'};
  const pill=document.getElementById('intent-pill');
  pill.textContent=intentStr.replace('_', ' ');
  pill.style.background=`${colors[intentStr]||'#6366f1'}20`;
  pill.style.color=colors[intentStr]||'#a5b4fc';
  pill.style.borderColor=`${colors[intentStr]||'#6366f1'}40`;
}

function resetAll(){
  NODES.forEach(n=>setNode(n.id,'idle'));
  EDGES.forEach(([f,t])=>{const k=`${f}→${t}`;if(edgeSel[k])edgeSel[k].attr('class','edge')});
  INTENT_PILLS.forEach(p=>{
    pillSel[p.id].select('rect').attr('class','intent-tag inactive-intent');
    pillSel[p.id].select('text').attr('fill','#475569');
  });
  document.getElementById('loglist').innerHTML='';
  document.getElementById('answer-card').style.display='none';
  document.getElementById('answer-text').textContent='';
  document.getElementById('intent-display').style.display='none';
}

function addLog(icon, tag, tagClass, text){
  const d=document.createElement('div');
  d.className='log-entry';
  d.innerHTML=`<span class="log-icon">${icon}</span><div class="log-text"><span class="log-tag ${tagClass}">${tag}</span>${text}</div>`;
  const ll=document.getElementById('loglist');
  ll.appendChild(d);
  ll.scrollTop=ll.scrollHeight;
}

function setStatus(txt,state=''){
  document.getElementById('stxt').textContent=txt;
  document.getElementById('sdot').className=`dot ${state}`;
}

function activateFromStep(step, lgNode){
  let matched = false;
  for(const m of STEP_MAP){
    if(m.pat.test(step)){
      m.nodes.forEach(id=>{
        setNode(id,'active');
        // Activate edge from retrieve_agent for retrieval nodes, or from the current lgNode
        const fromNode = lgNode==='retrieve' ? 'retrieve_agent' : lgNode;
        activateEdge(fromNode, id);
        // Activate internal edges between retrieval pipeline components
        if(id==='ensemble')    { activateEdge('vectordb','ensemble'); activateEdge('bm25','ensemble'); }
        if(id==='multiquery')  { activateEdge('retrieve_agent','multiquery'); }
        if(id==='graphdb')     { activateEdge('multiquery','graphdb'); }
        if(id==='vectordb')    { activateEdge('multiquery','vectordb'); }
        if(id==='bm25')        { activateEdge('multiquery','bm25'); }
        // Activate tier/priorauth → merger edges
        if(id==='bronze')      { activateEdge('retrieve_agent','bronze');  activateEdge('bronze','merger'); }
        if(id==='silver')      { activateEdge('retrieve_agent','silver');  activateEdge('silver','merger'); }
        if(id==='gold')        { activateEdge('retrieve_agent','gold');    activateEdge('gold','merger'); }
        if(id==='priorauth')   { activateEdge('retrieve_agent','priorauth'); activateEdge('priorauth','merger'); }
        if(id==='reranker')    { activateEdge('ensemble','reranker'); activateEdge('graphdb','reranker'); }
        if(id==='merger')      { activateEdge('reranker','merger'); }
      });
      matched = true;
      break;  // break on first match to use the most specific pattern
    }
  }
}

async function run(){
  const q=document.getElementById('qinput').value.trim();
  if(!q){alert('Enter a query first!');return;}
  resetAll();
  multiQueryVariants = [];
  const btn=document.getElementById('runbtn');
  btn.disabled=true;
  setStatus('Connecting to local agent websocket…','running');

  let activeNodeIds=[];
  let currentIntent='';

  try{
    const url=`${API}/chat/stream?session_id=${encodeURIComponent(SID)}&query=${encodeURIComponent(q)}`;
    const resp=await fetch(url);
    const reader=resp.body.getReader();
    const dec=new TextDecoder();
    let buf='';

    while(true){
      const {value,done}=await reader.read();
      if(done) break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');
      buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith('data: ')) continue;
        const raw=line.slice(6).trim();
        if(raw==='[DONE]'){
          activeNodeIds.forEach(id=>setNode(id,'done'));
          setNode('answer','done');
          setStatus('✅ Execution stream completed successfully.','done');
          break;
        }
        try{
          const ev=JSON.parse(raw);
          handleEvent(ev);
          if(ev.intent) currentIntent=ev.intent;
        }catch(_){}
      }
    }
  }catch(err){
    setStatus('❌ Process crashed: '+err.message,'');
    addLog('❌','ERROR','tag-error',err.message);
  }finally{
    btn.disabled=false;
  }

  function handleEvent(ev){
    const {type,node,intent,step,msg,answer}=ev;

    if(intent && intent!==currentIntent){
      currentIntent=intent;
      setIntent(intent);
    }

    if(type==='node_start'){
      const diagramNodes=LG_START[node]||[];
      activeNodeIds.forEach(id=>setNode(id,'done'));
      
      if(node==='user'){setNode('user','active');activeNodeIds=['user'];activateEdge('user','fastapi');}
      else if(node==='fastapi'){setNode('fastapi','active');activeNodeIds=['fastapi'];activateEdge('fastapi','orchestrator');}
      else if(node==='orchestrator'){setNode('orchestrator','active');activeNodeIds=['orchestrator'];activateEdge('orchestrator','mem_search');}
      else{
        diagramNodes.forEach(id=>{setNode(id,'active');activateEdge('orchestrator',id);});
        activeNodeIds=diagramNodes;
      }
      const tagClass=node==='classify_intent'?'tag-classify':node==='retrieve'?'tag-retrieve':node==='synthesize'?'tag-synthesize':'tag-system';
      addLog('▶','START',tagClass,node+(msg?' — '+msg:''));
      setStatus(`Executing node: [${node}]…`,'running');
    }

    if(type==='substep'){
      activateFromStep(step||'',node||'');
      const tagClass=node==='retrieve'?'tag-retrieve':node==='synthesize'?'tag-synthesize':'tag-classify';
      addLog('→','STEP',tagClass,step||'');
      
      if(step && step.includes('🧠 Multi-Query Variant')){
        const variantText = step.split(':').slice(1).join(':').trim();
        multiQueryVariants.push(variantText);
      }
    }

    if(type==='node_done'){
      if(node==='retrieve'){
        const allRetrieval=['graphdb','vectordb','bm25','ensemble','multiquery','priorauth','bronze','silver','gold'];
        allRetrieval.forEach(id=>{
          const el=document.getElementById(`nd-${id}`);
          if(el && el.getAttribute('class')==='n idle') setNode(id,'skip');
          else if(el) setNode(id,'done');
        });

        // Activate reranker to show scoring phase, then transition edges
        activateEdge('ensemble','reranker'); activateEdge('graphdb','reranker');
        setNode('reranker','active');
      }
      if(node==='synthesize'){
        setNode('reranker','done');setNode('merger','done');doneEdge('merger','synthesis');
        setNode('langsmith','active');activateEdge('synthesis','langsmith');
        setTimeout(()=>setNode('langsmith','done'), 600);
      }
      if(node==='memory_add'){
        doneEdge('synthesis','mem_add');doneEdge('mem_add','answer');
        setNode('mem_add','done');setNode('answer','active');
        if(answer){
          document.getElementById('answer-text').textContent=answer;
          document.getElementById('answer-card').style.display='block';
        }
      }
      if(node==='classify_intent') setNode('retrieve_agent','active');
      const tagClass=node==='synthesize'?'tag-synthesize':node==='retrieve'?'tag-retrieve':'tag-classify';
      addLog('✅','DONE',tagClass,`${node} execution complete`);
    }

    if(type==='error'){
      addLog('❌','ERROR','tag-error',msg);
      setStatus('❌ Node Error: '+msg,'');
    }
  }
}

document.getElementById('qinput').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey))run();});
</script>
